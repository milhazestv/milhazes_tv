name: backfill-historico

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: 'id da fonte em config/trackers.yml'
        required: true
        type: string
      date_from:
        description: 'AAAA-MM-DD (vazio = since do tema)'
        required: false
        type: string
      date_to:
        description: 'AAAA-MM-DD (vazio = hoje)'
        required: false
        type: string

permissions:
  contents: write

# Mesmo grupo do workflow "recolha": impede que as duas corridas escrevam
# em docs/data ao mesmo tempo uma da outra. Não protege contra um push
# manual feito por fora do GitHub Actions -- para isso serve o retry
# no passo de publicação, abaixo.
concurrency:
  group: recolha
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Backfill via Wayback Machine
        run: |
          python -m collector.backfill_wayback "${{ inputs.source_id }}" \
            ${{ inputs.date_from && format('--from {0}', inputs.date_from) || '' }} \
            ${{ inputs.date_to && format('--to {0}', inputs.date_to) || '' }}

      - name: Publicar alterações
        run: |
          if [ -z "$(git status --porcelain docs/data)" ]; then
            echo "sem alteracoes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "backfill: ${{ inputs.source_id }} via wayback machine"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejeitado, a tentar rebase (tentativa $i/5)..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((i * 3))
          done
          echo "não foi possível publicar depois de 5 tentativas" >&2
          exit 1
