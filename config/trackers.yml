---
# Configuracao declarativa do observatorio.
#
# Nada no codigo conhece "guerra", "crime" ou qualquer figura publica.
# Para acrescentar um tema novo basta editar este ficheiro.
#
#   topics   -> o tema medido (Infotainment de Guerra, Crime na TV, ...)
#   subjects -> quem ou o que e contabilizado dentro do tema
#   sources  -> de onde vem a informacao e como e atribuida
#
# Regra de atribuicao (attribution):
#   shared_equal -> um bloco de 20 min com 2 intervenientes conta 10 min a cada
#   each_full    -> o mesmo bloco conta 20 min a cada
# O site publica as duas leituras. shared_equal e o valor conservador
# e e o que aparece por omissao.

version: 1

topics:
  - id: guerra
    name: Infotainment de Guerra
    question: Quanto tempo de emissao ocupa o comentario permanente sobre guerra?
    since: '2022-02-24'
    enabled: true

  - id: crime
    name: Crime na grelha
    question: Quanto tempo de emissao ocupam os programas dedicados a crime?
    since: '2022-01-01'
    enabled: false

  - id: ventura
    name: Tempo de antena de Andre Ventura
    question: Quanto tempo de emissao ocupam entrevistas e conferencias de imprensa?
    since: '2022-01-01'
    enabled: false

subjects:
  - id: milhazes
    topic: guerra
    display_name: Jose Milhazes
    role: comentador
    match:
      any: [milhazes]

  - id: rogeiro
    topic: guerra
    display_name: Nuno Rogeiro
    role: comentador
    match:
      any: [rogeiro]

sources:
  # ------------------------------------------------------------------
  # Feeds de podcast (Omny Studio). Duracao exata por episodio,
  # sem scraping, com historico completo desde 2022.
  # ------------------------------------------------------------------
  - id: omny-guerra-fria
    type: podcast_rss
    enabled: true
    topic: guerra
    url: https://omny.fm/shows/guerra-fria/playlists/podcast.rss
    channel: SIC
    program: Jornal da Noite
    segment: Guerra Fria
    # Elenco fixo: todos os episodios contam para ambos.
    roster: [milhazes, rogeiro]
    attribution: shared_equal
    confidence: high

  - id: omny-leste-oeste
    type: podcast_rss
    enabled: true
    topic: guerra
    url: https://www.omnycontent.com/d/playlist/8c0a4104-a688-4e57-91fd-ad7b00d5dddd/c21f9593-318c-4f18-965a-ad8e00c1c070/e4249a83-8aee-4f34-90b1-ad8e00c1c087/podcast.rss
    channel: SIC Noticias
    program: Leste/Oeste
    segment: Leste/Oeste
    roster: [rogeiro]
    attribution: shared_equal
    confidence: high

  # Fila de espera: confirmar o slug antes de activar.
  # Usar `python -m collector.discover <url do programa em omny.fm>`.
  - id: omny-jogos-de-poder
    type: podcast_rss
    enabled: false
    topic: guerra
    url: ''
    channel: SIC
    program: Jogos de Poder
    segment: ''
    roster: [rogeiro]
    attribution: shared_equal
    confidence: high

  # ------------------------------------------------------------------
  # YouTube. Apanha as intervencoes avulsas fora das rubricas fixas.
  # Precisa de YT_API_KEY no ambiente. Sem chave, a fonte e ignorada
  # em silencio e o resto da recolha corre na mesma.
  # ------------------------------------------------------------------
  - id: yt-sicnoticias
    type: youtube
    enabled: false
    topic: guerra
    handle: '@SICNoticias'
    channel: SIC Noticias
    program: ''
    # Sem elenco fixo: os intervenientes sao detectados por match.
    roster: auto
    attribution: shared_equal
    confidence: medium
    # Filtro previo para nao gastar quota com o catalogo inteiro.
    query_terms: [Milhazes, Rogeiro]
